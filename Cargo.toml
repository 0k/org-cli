[package]
name = "org-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for querying and editing org-mode files"
license = "MIT"

[features]
# `server` (in default) compiles the daemon: the tokio/axum/kal-sse
# HTTP+SSE serving layer plus the `daemon` subcommand. Building with
# `--no-default-features` strips all three heavy dependencies and the
# `daemon` action, leaving the pure-sync core (index + watch) intact —
# the strippability requirement of plan 09 (see `src/serve` and
# `src/watch` module docs).
default = ["server"]
server = ["dep:tokio", "dep:axum", "dep:kal-sse"]

[dependencies]
axum = { version = "0.8", optional = true }
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "5"
fern = "0.6"
glob = "0.3"
kal-sse = { git = "https://github.com/0k/kal-sse", rev = "1e1a253e424380bb89b4d4821bcea354f7f06c42", features = ["axum"], optional = true }
libc = "0.2"
log = "0.4"
notify = "6"
orgize = "0.10.0-alpha.10"
percent-encoding = "2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
tempfile = "3"
time = { version = "0.3", features = ["std", "local-offset", "formatting"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
], optional = true }
walkdir = "2"
xattr = "1"

[dev-dependencies]
indoc = "2"
reqwest = { version = "0.12", features = ["blocking"] }

# Patch orgize-0.10.0-alpha.10 with a fork that teaches its timestamp
# parser about numerical UTC offsets (`+0200` / `-0500`) and seconds
# precision (`09:57:20`, `=>  2:22:05`).
#
# Upstream's `repeater_or_delay` also starts on `+`/`-`, consumes the
# digits, then REQUIRES a unit (`h`/`d`/`w`/`m`/`y`).  Given `+0200` it
# matched `+`, read `0200`, found no unit and failed — which aborted the
# WHOLE timestamp, so any `CLOCK:` line carrying an offset silently
# degraded to a plain paragraph.  The same bug hid clocks inside
# `:LOGBOOK:` drawers.
#
# Both forms are valid org-mode and are what Emacs itself writes, so
# without this patch the entire canonical CLOCK corpus is invisible to
# `Headline::clocks()` — and therefore to `org::ast`, whose semantic
# AST is consumed by `vigil-watch`'s `/api/data-flow` item endpoint and
# rendered by `vigil-ui`'s Org renderer.
#
# `vigil-watch` applies the identical patch; keeping both crates on the
# same revision is what makes the shared AST fixture meaningful.
#
# Source: https://github.com/0k/orgize
#   branch: vaab/timestamp-tz-offset-and-seconds
[patch.crates-io]
orgize = { git = "https://github.com/0k/orgize", rev = "eb732b352a9c57a9a9d4662dabfaf725510baf6a" }
